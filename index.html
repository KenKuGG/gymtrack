<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>GymTrack! — Simulador iOS & Android</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,700;0,800;0,900;1,900&family=Inter:wght@500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #F8FAFC;
      --surface: #FFFFFF;
      --surface-elevated: #F1F5F9;
      --menu-bg: #FFFFFF;
      --border: #E2E8F0;
      --text: #0F172A;
      --text-sec: #334155;
      --muted: #64748B;
      --input-bg: #F8FAFC;
      --accent: #090D16;
      --on-accent: #FFFFFF;
      --accent-soft: rgba(15, 23, 42, 0.07);
      --tick-blue: #38BDF8;
      --tick-blue-soft: rgba(56, 189, 248, 0.11);
      --orange: #F97316;
      --blue: #0284C7;
      --ring-move: #FA114F;
      --ring-diet: #92E82A;
      --ring-hydro: #00D7FF;
    }

    .phone-frame.dark-theme {
      --bg: #090D16;
      --surface: #111827;
      --surface-elevated: #172033;
      --menu-bg: #0F172A;
      --border: #1E293B;
      --text: #F8FAFC;
      --text-sec: #CBD5E1;
      --muted: #94A3B8;
      --input-bg: #0B0F19;
      --orange: #FB923C;
      --blue: #38BDF8;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif; }
    body {
      background: radial-gradient(circle at top, #1E293B 0%, #090D16 75%);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 14px 10px;
      color: #F8FAFC;
    }

    .simulator-toolbar {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      justify-content: center;
      margin-bottom: 12px;
    }
    .toolbar-group {
      display: flex;
      gap: 5px;
      background: #0F172A;
      padding: 5px;
      border-radius: 999px;
      border: 1px solid #334155;
    }
    .tool-btn {
      background: transparent;
      color: #94A3B8;
      border: none;
      padding: 6px 13px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
    }
    .tool-btn.active {
      background: #F8FAFC;
      color: #090D16;
    }

    .phone-frame {
      width: 420px;
      max-width: 100%;
      height: 850px;
      background: var(--bg);
      color: var(--text);
      border-radius: 46px;
      border: 10px solid #1E293B;
      box-shadow: 0 25px 70px rgba(0,0,0,0.65);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      position: relative;
      transition: background 0.25s, color 0.25s;
    }
    .phone-frame.android { border-radius: 28px; border-width: 8px; }

    @media (max-width: 560px) {
      body {
        padding: 0;
        background: var(--bg);
      }
      .simulator-toolbar,
      .status-bar {
        display: none !important;
      }
      .phone-frame,
      .phone-frame.android {
        width: 100vw;
        height: 100dvh;
        min-height: 100vh;
        border: none;
        border-radius: 0;
        box-shadow: none;
      }
    }

    .status-bar {
      display: flex;
      justify-content: space-between;
      padding: 10px 22px 6px;
      font-size: 12px;
      font-weight: 700;
      color: var(--text-sec);
      background: var(--menu-bg);
    }

    /* LOGO GT! EN CÍRCULO NEGRO CON FUENTE MODERNA BLANCA */
    .gt-logo-circle {
      background: #000000;
      border: 2.5px solid #334155;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 10px 25px rgba(0,0,0,0.35);
      user-select: none;
      flex-shrink: 0;
    }
    .gt-logo-circle.large { width: 132px; height: 132px; border-width: 3px; }
    .gt-logo-circle.small { width: 38px; height: 38px; border-width: 1.5px; box-shadow: 0 4px 10px rgba(0,0,0,0.25); }
    .gt-logo-letters {
      color: #FFFFFF;
      font-family: 'Montserrat', sans-serif;
      font-weight: 900;
      font-style: italic;
      letter-spacing: -1.5px;
      line-height: 1;
    }
    .gt-logo-circle.large .gt-logo-letters { font-size: 48px; }
    .gt-logo-circle.small .gt-logo-letters { font-size: 15px; letter-spacing: -0.8px; }

    .header-avatar {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      object-fit: cover;
      border: 2px solid var(--accent);
    }

    .brand-title-large {
      font-family: 'Montserrat', sans-serif;
      font-weight: 900;
      font-size: 36px;
      letter-spacing: -0.8px;
      margin-top: 18px;
      color: var(--text);
    }
    .brand-tagline {
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 2.4px;
      color: var(--muted);
      margin-top: 8px;
    }
    .brand-author {
      font-size: 10.5px;
      font-weight: 700;
      letter-spacing: 1.2px;
      color: var(--muted);
      opacity: 0.8;
      margin-top: 10px;
      text-align: center;
    }

    .intro-screen {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: center;
      padding: 70px 28px 44px;
      text-align: center;
      animation: fadeInScale 0.5s cubic-bezier(0.16, 1, 0.3, 1);
    }
    @keyframes fadeInScale {
      from { opacity: 0; transform: scale(0.9); }
      to { opacity: 1; transform: scale(1); }
    }

    .app-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 15px;
      background: var(--menu-bg);
      border-bottom: 1px solid var(--border);
    }
    .brand-row { display: flex; align-items: center; gap: 8px; }
    .app-title {
      font-family: 'Montserrat', sans-serif;
      font-size: 18px;
      font-weight: 900;
      letter-spacing: -0.5px;
      color: var(--text);
    }
    .app-sub { font-size: 11px; color: var(--muted); font-weight: 600; }

    .step-dots { display: flex; gap: 5px; align-items: center; }
    .step-dot { height: 8px; width: 8px; border-radius: 4px; background: var(--border); transition: all 0.25s; }
    .step-dot.active { width: 20px; background: var(--accent); }
    .step-dot.done { background: var(--accent); }

    .screen-body { flex: 1; overflow-y: auto; padding: 14px; }
    .screen-body::-webkit-scrollbar { width: 5px; }
    .screen-body::-webkit-scrollbar-thumb { background: var(--border); border-radius: 99px; }

    /* INDICADOR TICS: MODERNO (CUADRADO) VS CLÁSICO (CÍRCULO) */
    .tick-box {
      width: 22px;
      height: 22px;
      border: 2px solid var(--muted);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 13px;
      font-weight: 900;
      flex-shrink: 0;
      transition: all 0.18s ease;
      color: transparent;
    }
    .tick-box.modern {
      border-radius: 5px;
    }
    .tick-box.classic {
      border-radius: 50%;
    }
    .tick-box.checked {
      background: var(--tick-blue);
      border-color: var(--tick-blue);
      color: #090D16;
    }

    /* MEDIDOR SUPERIOR */
    .live-gauge-card {
      background: var(--surface);
      border: 1.5px solid var(--accent);
      border-radius: 18px;
      padding: 13px 14px;
      margin-bottom: 13px;
      box-shadow: 0 6px 20px rgba(0,0,0,0.05);
    }
    .gauge-top-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
    }
    .water-pill {
      background: var(--surface-elevated);
      color: var(--blue);
      border: 1px solid var(--border);
      padding: 4px 9px;
      border-radius: 999px;
      font-size: 11px;
      font-weight: 800;
      cursor: pointer;
    }
    .gauge-bar-label {
      display: flex;
      justify-content: space-between;
      font-size: 12px;
      font-weight: 800;
      margin-bottom: 4px;
    }
    .progress-bg { height: 9px; background: var(--surface-elevated); border-radius: 99px; overflow: hidden; margin-bottom: 9px; }
    .progress-fill-g { height: 100%; background: var(--accent); transition: width 0.35s ease; }
    .progress-fill-o { height: 100%; background: var(--orange); transition: width 0.35s ease; }

    .live-macros-grid {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 7px;
      margin-top: 4px;
    }
    .live-macro-box {
      background: var(--surface-elevated);
      border-radius: 10px;
      padding: 6px 4px;
      text-align: center;
    }

    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 15px;
      margin-bottom: 13px;
    }
    .step-badge {
      font-size: 10px;
      font-weight: 900;
      letter-spacing: 0.9px;
      color: var(--accent);
      margin-bottom: 4px;
      text-transform: uppercase;
    }
    .card-title { font-size: 17px; font-weight: 900; color: var(--text); margin-bottom: 5px; }
    .card-helper { font-size: 12.5px; color: var(--muted); margin-bottom: 11px; line-height: 1.45; }

    .label { font-size: 12px; font-weight: 700; color: var(--text-sec); margin: 9px 0 5px; display: block; }
    .input {
      width: 100%;
      background: var(--input-bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 10px 12px;
      color: var(--text);
      font-size: 14px;
      font-weight: 600;
    }
    .row-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .seg-row { display: flex; gap: 8px; margin-bottom: 10px; }
    .seg-btn {
      flex: 1;
      background: var(--input-bg);
      border: 1px solid var(--border);
      color: var(--muted);
      padding: 10px;
      border-radius: 11px;
      font-weight: 800;
      font-size: 12.5px;
      cursor: pointer;
    }
    .seg-btn.active {
      background: var(--accent);
      border-color: var(--accent);
      color: var(--on-accent);
    }
    .opt-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: var(--input-bg);
      border: 1px solid var(--border);
      padding: 11px 12px;
      border-radius: 13px;
      margin-bottom: 7px;
      cursor: pointer;
      gap: 10px;
    }
    .opt-row.active {
      border-color: var(--tick-blue);
      background: var(--tick-blue-soft);
    }
    .opt-title { font-size: 13.5px; font-weight: 800; color: var(--text); }
    .opt-sub { font-size: 11px; color: var(--muted); margin-top: 2px; line-height: 1.35; }

    .chips { display: flex; flex-wrap: wrap; gap: 7px; margin: 8px 0; }
    .chip {
      background: var(--input-bg);
      border: 1px solid var(--border);
      color: var(--muted);
      padding: 6px 11px;
      border-radius: 8px;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
    }
    .chip.active {
      background: rgba(239, 68, 68, 0.15);
      border-color: #EF4444;
      color: #EF4444;
    }

    .wizard-actions { display: flex; gap: 10px; margin-top: 6px; padding-bottom: 10px; }
    .btn-back {
      background: var(--surface);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 13px 16px;
      border-radius: 13px;
      font-weight: 800;
      font-size: 13px;
      cursor: pointer;
    }
    .btn-primary {
      flex: 1;
      width: 100%;
      background: var(--accent);
      color: var(--on-accent);
      border: none;
      padding: 14px;
      border-radius: 13px;
      font-weight: 900;
      font-size: 14px;
      cursor: pointer;
    }

    .week-selector-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 7px 10px;
      margin-bottom: 10px;
    }
    .week-btn {
      background: var(--surface-elevated);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 5px 10px;
      border-radius: 8px;
      font-size: 11px;
      font-weight: 800;
      cursor: pointer;
    }

    .days-bar {
      display: flex;
      gap: 6px;
      overflow-x: auto;
      padding-bottom: 8px;
      margin-bottom: 10px;
    }
    .day-pill {
      background: var(--surface);
      border: 1px solid var(--border);
      color: var(--muted);
      padding: 8px 13px;
      border-radius: 10px;
      font-size: 12px;
      font-weight: 800;
      cursor: pointer;
      white-space: nowrap;
    }
    .day-pill.active {
      background: var(--accent);
      color: var(--on-accent);
      border-color: var(--accent);
    }

    .meal-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 13px;
      margin-bottom: 12px;
      transition: border-color 0.2s;
    }
    .meal-card.logged {
      border-color: var(--accent);
      border-width: 1.5px;
    }
    .meal-img-wrap {
      width: 100%;
      height: 155px;
      border-radius: 12px;
      overflow: hidden;
      position: relative;
      margin-bottom: 10px;
      background: #1E293B;
    }
    .meal-img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }
    .ai-photo-pill {
      position: absolute;
      bottom: 8px;
      right: 8px;
      background: rgba(0,0,0,0.78);
      color: #FFFFFF;
      font-size: 10px;
      font-weight: 800;
      padding: 4px 9px;
      border-radius: 99px;
    }
    .new-recipe-badge {
      position: absolute;
      top: 8px;
      left: 8px;
      background: var(--accent);
      color: #090D16;
      font-size: 10px;
      font-weight: 900;
      padding: 3px 8px;
      border-radius: 6px;
    }
    .meal-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; }
    .meal-badge { background: var(--surface-elevated); color: var(--blue); font-size: 11px; font-weight: 800; padding: 4px 9px; border-radius: 6px; }
    .meal-kcal { color: var(--accent); font-weight: 900; font-size: 13px; }
    .meal-tags { display: flex; gap: 6px; flex-wrap: wrap; margin: 8px 0; }
    .meal-tag { background: var(--surface-elevated); color: var(--text-sec); font-size: 11px; font-weight: 600; padding: 4px 8px; border-radius: 6px; }
    .supp-inline {
      background: var(--surface-elevated);
      border: 1px solid var(--accent);
      color: var(--accent);
      font-size: 11.5px;
      font-weight: 800;
      padding: 7px 10px;
      border-radius: 9px;
      margin: 7px 0;
    }
    .recipe-box {
      background: var(--surface-elevated);
      border: 1px solid var(--border);
      border-radius: 11px;
      padding: 11px;
      margin: 8px 0;
      font-size: 12px;
      line-height: 1.5;
      color: var(--text-sec);
    }

    .avatar-presets {
      display: flex;
      gap: 10px;
      margin: 8px 0 12px;
      align-items: center;
    }
    .avatar-thumb {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      object-fit: cover;
      border: 2.5px solid transparent;
      cursor: pointer;
    }
    .avatar-thumb.selected { border-color: var(--accent); }

    /* ESTILOS APPLE FITNESS REGISTRO */
    .fitness-week-strip {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 4px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 10px 6px;
      margin-bottom: 12px;
      text-align: center;
    }
    .fitness-day-cell {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 5px;
      padding: 6px 2px;
      border-radius: 12px;
      cursor: pointer;
    }
    .fitness-day-cell.active {
      background: var(--surface-elevated);
      outline: 1.5px solid var(--accent);
    }
    .fitness-month-weekdays {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 5px;
      margin-top: 8px;
      margin-bottom: 4px;
      text-align: center;
      font-size: 10px;
      font-weight: 900;
      color: var(--muted);
    }
    .fitness-month-grid {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 5px;
    }
    .fitness-month-cell {
      background: var(--surface-elevated);
      border-radius: 10px;
      padding: 6px 2px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 3px;
      cursor: pointer;
      border: 1.5px solid transparent;
      position: relative;
      min-height: 54px;
      justify-content: center;
    }
    .fitness-month-cell.empty {
      background: transparent;
      cursor: default;
      pointer-events: none;
    }
    .fitness-month-cell.today {
      border-color: var(--tick-blue);
      background: var(--tick-blue-soft);
    }
    .fitness-month-cell.active {
      border-color: var(--accent);
      box-shadow: 0 0 0 1px var(--accent);
    }

    .bottom-nav {
      display: flex;
      background: var(--menu-bg);
      border-top: 1px solid var(--border);
      padding: 8px 0 11px;
    }
    .nav-btn {
      flex: 1;
      background: transparent;
      border: none;
      color: var(--muted);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 3px;
      font-size: 10.5px;
      font-weight: 800;
      cursor: pointer;
    }
    .nav-btn.active { color: var(--accent); }
  </style>
</head>
<body>

  <div class="simulator-toolbar">
    <div class="toolbar-group">
      <button class="tool-btn active" id="btn-ios" onclick="setDevice('ios')">🍎 iPhone (iOS)</button>
      <button class="tool-btn" id="btn-android" onclick="setDevice('android')">🤖 Android</button>
    </div>
    <div class="toolbar-group">
      <button class="tool-btn active" id="btn-theme-light" onclick="setSystemThemeSimulation('light')">☀️ Simular Móvil Claro</button>
      <button class="tool-btn" id="btn-theme-dark" onclick="setSystemThemeSimulation('dark')">🌙 Simular Móvil Oscuro</button>
    </div>
    <div class="toolbar-group">
      <button class="tool-btn active" onclick="document.getElementById('qr-modal').style.display='flex'">📱 Abrir en mi Móvil (QR)</button>
    </div>
  </div>

  <!-- MODAL QR PARA ESCANEAR CON EL MÓVIL -->
  <div id="qr-modal" onclick="if(event.target===this)this.style.display='none'" style="display:none;position:fixed;inset:0;background:rgba(9,13,22,0.85);z-index:9999;align-items:center;justify-content:center;padding:20px;">
    <div style="background:#0F172A;border:1px solid #334155;border-radius:24px;padding:24px;max-width:360px;width:100%;text-align:center;color:#F8FAFC;box-shadow:0 25px 60px rgba(0,0,0,0.7);">
      <div style="font-family:'Montserrat',sans-serif;font-weight:900;font-size:20px;margin-bottom:6px;">📱 GymTrack! en tu Móvil</div>
      <div style="font-size:12px;color:#94A3B8;margin-bottom:16px;line-height:1.45;">Escanea este código QR con la cámara de tu móvil (funciona fuera de casa con 4G/5G aunque apagues el PC):</div>
      <div style="background:#FFFFFF;padding:14px;border-radius:18px;display:inline-block;margin-bottom:14px;">
        <img src="https://api.qrserver.com/v1/create-qr-code/?size=240x240&margin=8&data=https://kenkugg.github.io/gymtrack/" alt="QR GymTrack!" style="width:220px;height:220px;display:block;" />
      </div>
      <div style="font-size:11.5px;color:#38BDF8;font-weight:800;word-break:break-all;margin-bottom:16px;">https://kenkugg.github.io/gymtrack/</div>
      <button onclick="document.getElementById('qr-modal').style.display='none'" style="width:100%;background:#FFFFFF;color:#090D16;border:none;padding:12px;border-radius:12px;font-weight:900;font-size:13.5px;cursor:pointer;">Cerrar</button>
    </div>
  </div>

  <div class="phone-frame" id="phone-frame">
    <div class="status-bar">
      <span>9:41</span>
      <span id="device-os-tag">iOS 18 • 5G 🔋</span>
    </div>
    <div id="app-mount" style="flex:1;display:flex;flex-direction:column;overflow:hidden;"></div>
  </div>

  <script>
    function makeAvatarSvg(emoji, bgColor) {
      const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="120" height="120" viewBox="0 0 120 120"><circle cx="60" cy="60" r="60" fill="${bgColor}"/><text x="50%" y="54%" font-size="58" text-anchor="middle" dominant-baseline="central">${emoji}</text></svg>`;
      return 'data:image/svg+xml;utf8,' + encodeURIComponent(svg);
    }

    // 6 Avatares simples de Gimnasio y Comida + 6 Avatares de Animales
    const FITNESS_FOOD_AVATARS = [
      { id: 'dumbbell', label: 'Mancuerna', emoji: '🏋️', url: makeAvatarSvg('🏋️', '#0F172A') },
      { id: 'muscle',   label: 'Fuerza',    emoji: '💪', url: makeAvatarSvg('💪', '#065F46') },

    // =========================================================================
    // CALENDARIO REAL DEL DISPOSITIVO (Sincronizado con el reloj del móvil/PC)
    // =========================================================================
    const MONTH_NAMES_ES = [
      'Enero', 'Febrero', 'Marzo', 'Abril', 'Mayo', 'Junio',
      'Julio', 'Agosto', 'Septiembre', 'Octubre', 'Noviembre', 'Diciembre'
    ];
    const WEEKDAY_SHORT_ES = ['L', 'M', 'X', 'J', 'V', 'S', 'D'];
    const WEEKDAY_FULL_ES = ['Lunes', 'Martes', 'Miércoles', 'Jueves', 'Viernes', 'Sábado', 'Domingo'];

    function getDeviceToday() {
      const now = new Date();
      return new Date(now.getFullYear(), now.getMonth(), now.getDate());
    }

    function formatDateKey(dateObj) {
      const y = dateObj.getFullYear();
      const m = String(dateObj.getMonth() + 1).padStart(2, '0');
      const d = String(dateObj.getDate()).padStart(2, '0');
      return `${y}-${m}-${d}`;
    }

    function parseDateKey(dateKey) {
      const parts = (dateKey || '').split('-').map(Number);
      if (parts.length !== 3 || !parts[0] || !parts[1] || !parts[2]) return getDeviceToday();
      return new Date(parts[0], parts[1] - 1, parts[2]);
    }

    function getMondayOfWeek(dateObj) {
      const d = new Date(dateObj.getFullYear(), dateObj.getMonth(), dateObj.getDate());
      const weekdayIdx = (d.getDay() + 6) % 7; // 0=Lunes .. 6=Domingo
      d.setDate(d.getDate() - weekdayIdx);
      return d;
    }

    function getDateMetadata(dateKey) {
      const d = parseDateKey(dateKey);
      const today = getDeviceToday();
      const todayKey = formatDateKey(today);
      const wIdx = (d.getDay() + 6) % 7;
      return {
        dateObj: d,
        dateKey: formatDateKey(d),
        dayOfMonth: d.getDate(),
        monthIndex: d.getMonth(),
        monthName: MONTH_NAMES_ES[d.getMonth()],
        year: d.getFullYear(),
        weekdayIndex: wIdx,
        weekdayShort: WEEKDAY_SHORT_ES[wIdx],
        weekdayFull: WEEKDAY_FULL_ES[wIdx],
        isToday: formatDateKey(d) === todayKey,
        isPast: d < today,
        isFuture: d > today
      };
    }

    function getWeekDaysForDate(refDateObj) {
      const monday = getMondayOfWeek(refDateObj);
      return Array.from({ length: 7 }, (_, i) => {
        const cur = new Date(monday.getFullYear(), monday.getMonth(), monday.getDate() + i);
        return getDateMetadata(formatDateKey(cur));
      });
    }

    function getDeviceCalendarMonthGrid(year, monthIndex) {
      const firstDay = new Date(year, monthIndex, 1);
      const daysInMonth = new Date(year, monthIndex + 1, 0).getDate();
      const leadingEmptySlots = (firstDay.getDay() + 6) % 7; // Alineación real L..D
      const days = [];
      for (let dayNum = 1; dayNum <= daysInMonth; dayNum++) {
        const cur = new Date(year, monthIndex, dayNum);
        days.push(getDateMetadata(formatDateKey(cur)));
      }
      return {
        year,
        monthIndex,
        monthName: MONTH_NAMES_ES[monthIndex],
        daysInMonth,
        leadingEmptySlots,
        days
      };
    }

    function getUsersDb() {
      try {
        const raw = localStorage.getItem(USERS_DB_KEY);
        return raw ? JSON.parse(raw) : {};

    function saveUsersDb(db) {

    function saveCurrentUserState() {
      if (!state.currentUser) return;
      const db = getUsersDb();
      const key = state.currentUser.toLowerCase();
      const existing = db[key] || {};

        username: existing.username || state.currentUser,

    function applyUserAccountToState(account) {
      state.currentUser = account.username;
      state.onboardingCompleted = !!account.onboardingCompleted;

      state.accentKey = (!account.accentKey || account.accentKey === 'emerald') ? 'monochrome' : account.accentKey;
      state.uiTickStyle = account.uiTickStyle || 'modern';
      state.showUserRecipePhotos = account.showUserRecipePhotos !== undefined ? account.showUserRecipePhotos : true;
      state.userRecipePhotos = account.userRecipePhotos || {};
      state.profilePhotoUrl = account.profilePhotoUrl || FITNESS_FOOD_AVATARS[0].url;
      state.currentWeekNumber = account.currentWeekNumber || 1;
      if (account.profile) state.profile = account.profile;
      if (account.preferences) state.preferences = account.preferences;
      state.loggedMealsMap = account.loggedMealsMap || {};
      state.checkedShoppingItems = account.checkedShoppingItems || {};
      state.customShoppingItems = account.customShoppingItems || [];

      CALENDAR_LOGS_BY_DATE = account.calendarLogsByDate
        ? JSON.parse(JSON.stringify(account.calendarLogsByDate))
        : {};

      const today = getDeviceToday();
      state.calendarYear = today.getFullYear();
      state.calendarMonth = today.getMonth();
      state.selectedDateKey = formatDateKey(today);
      state.selectedDay = (today.getDay() + 6) % 7;
    }

    function initSavedSessionOnBoot() {
      try {
        const activeKey = localStorage.getItem(ACTIVE_USER_KEY);
        const db = getUsersDb();
        if (activeKey && db[activeKey]) {
          applyUserAccountToState(db[activeKey]);
        } else if (Object.keys(db).length > 0) {
          const firstAcc = Object.values(db)[0];
          if (firstAcc && firstAcc.onboardingCompleted) {
            applyUserAccountToState(firstAcc);
          }
          state.authMode = 'login';
        } else {
          state.authMode = 'register';
        }
        state.stage = 'intro';
      } catch (e) {}
    }

    function handleAuthSubmit() {
      const u = (state.authUsernameInput || '').trim();
      const p = (state.authPasswordInput || '').trim();
      if (!u || !p) {
        state.authErrorMsg = 'Por favor, introduce tu usuario y contraseña.';
        render();
        return;
      }
      const db = getUsersDb();
      const key = u.toLowerCase();

      if (state.authMode === 'login') {
        if (!db[key]) {
          state.authErrorMsg = 'Ese usuario no existe aún. Pulsa en "Crear Cuenta" para registrarte por primera vez.';
          render();
          return;
        }
        if (db[key].password !== p) {
          state.authErrorMsg = 'Contraseña incorrecta. Inténtalo de nuevo.';
          render();
          return;
        }
        state.authErrorMsg = '';
        applyUserAccountToState(db[key]);
        localStorage.setItem(ACTIVE_USER_KEY, key);
        state.stage = state.onboardingCompleted ? 'main' : 'onboarding';
        state.tab = 'diet';
        render();
      } else {
        if (db[key]) {
          state.authErrorMsg = 'Ese nombre de usuario ya está registrado. Elige otro o inicia sesión.';
          render();
          return;
        }
        CALENDAR_LOGS_BY_DATE = {};
        const today = getDeviceToday();
        state.calendarYear = today.getFullYear();
        state.calendarMonth = today.getMonth();
        state.selectedDateKey = formatDateKey(today);
        state.selectedDay = (today.getDay() + 6) % 7;

        state.currentUser = u;
        state.onboardingCompleted = false;
        state.profile = {
          name: u,
          gender: 'male',
          age: 28,
          weightKg: 78,
          heightCm: 176,
          targetWeightKg: 72,
          activityLevel: 'moderate',
          goal: 'lose'
        };
        state.preferences = {
          dietType: 'mediterranean',
          allergies: [],

          dislikedFoods: 'Coliflor, hígado',
          mealsPerDay: 4,
          allowAiSupplementRecommendations: true,
          selectedSupplements: ['whey_protein', 'creatine']
        };
        state.profilePhotoUrl = FITNESS_FOOD_AVATARS[0].url;
        state.userRecipePhotos = {};

        db[key] = {
          username: u,

    // Obtiene la fecha ('YYYY-MM-DD') correspondiente al día de la semana (0=Lunes..6=Domingo) de la semana activa
    function getDateKeyForActiveWeekday(dayIdx) {
      const weekDays = getWeekDaysForDate(parseDateKey(state.selectedDateKey));
      return weekDays[dayIdx] ? weekDays[dayIdx].dateKey : state.selectedDateKey;
    }

    function getDayRecordByWeekday(dayIdx) {
      return getDayRecordByDateKey(getDateKeyForActiveWeekday(dayIdx));
    }

    // Calcula en tiempo real los porcentajes y calorías de cualquier fecha del calendario del dispositivo ('YYYY-MM-DD')
    function computeDayRealtimeStats(dateKey, m) {
      const rec = getDayRecordByDateKey(dateKey);
      const consumed = rec.foods.reduce((a, b) => a + b.cals, 0);
      const prot = rec.foods.reduce((a, b) => a + b.p, 0);
      const carbs = rec.foods.reduce((a, b) => a + b.c, 0);
      const fat = rec.foods.reduce((a, b) => a + b.f, 0);
      const burned = rec.exercises.reduce((a, b) => a + b.cals, 0);
      const waterL = rec.waterGlasses * 0.25;
      const targetWater = parseFloat(m.waterLiters) || 2.5;

      const dietPct = Math.min(100, Math.round((consumed / m.consume) * 100));
      const movePct = Math.min(100, Math.round((burned / m.burn) * 100));
      const hydroPct = Math.min(100, Math.round((waterL / targetWater) * 100));

      return {
        consumed, prot, carbs, fat, burned, waterL: waterL.toFixed(2),
        dietPct, movePct, hydroPct,
        foods: rec.foods,
        exercises: rec.exercises,
        waterGlasses: rec.waterGlasses,
        isLive: true
      };
    }

    const multipliers = { sedentary: 1.2, light: 1.375, moderate: 1.55, active: 1.725, very_active: 1.9 };
    const goalDeltas = { lose_fast: -600, lose: -400, maintain: 0, gain_muscle: 350 };
    const baseBurn = { sedentary: 250, light: 350, moderate: 480, active: 620, very_active: 780 };

    // Helper para dibujar el tic cuadrado ("moderno") o redondo ("clásico")
    function renderTick(isChecked) {
      return `<div class="tick-box ${state.uiTickStyle} ${isChecked ? 'checked' : ''}">✓</div>`;
    }

    // SVG de 3 Anillos Concéntricos estilo Apple Fitness
    function renderAppleFitnessRingsSVG(size, movePct, dietPct, hydroPct, strokeW = 6) {
      const center = size / 2;
      const r1 = center - strokeW;
      const r2 = r1 - strokeW - 3;
      const r3 = r2 - strokeW - 3;

      const c1 = 2 * Math.PI * r1;
      const c2 = 2 * Math.PI * r2;
      const c3 = 2 * Math.PI * r3;

      const o1 = c1 * (1 - Math.min(1, movePct / 100));
      const o2 = c2 * (1 - Math.min(1, dietPct / 100));
      const o3 = c3 * (1 - Math.min(1, hydroPct / 100));

      return `
        <svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}" style="transform: rotate(-90deg);">
          <circle cx="${center}" cy="${center}" r="${r1}" fill="none" stroke="rgba(250,17,79,0.2)" stroke-width="${strokeW}" />
          <circle cx="${center}" cy="${center}" r="${r1}" fill="none" stroke="#FA114F" stroke-width="${strokeW}" stroke-linecap="round" stroke-dasharray="${c1}" stroke-dashoffset="${o1}" />
          <circle cx="${center}" cy="${center}" r="${r2}" fill="none" stroke="rgba(146,232,42,0.2)" stroke-width="${strokeW}" />
          <circle cx="${center}" cy="${center}" r="${r2}" fill="none" stroke="#92E82A" stroke-width="${strokeW}" stroke-linecap="round" stroke-dasharray="${c2}" stroke-dashoffset="${o2}" />
          <circle cx="${center}" cy="${center}" r="${r3}" fill="none" stroke="rgba(0,215,255,0.2)" stroke-width="${strokeW}" />
          <circle cx="${center}" cy="${center}" r="${r3}" fill="none" stroke="#00D7FF" stroke-width="${strokeW}" stroke-linecap="round" stroke-dasharray="${c3}" stroke-dashoffset="${o3}" />
        </svg>
      `;
    }

    function computeMetrics() {
      const p = state.profile;
      const baseBmr = 10 * p.weightKg + 6.25 * p.heightCm - 5 * p.age;
      const bmr = Math.round(p.gender === 'male' ? baseBmr + 5 : baseBmr - 161);
      const tdee = Math.round(bmr * (multipliers[p.activityLevel] || 1.55));
      let burn = Math.round(baseBurn[p.activityLevel] * (p.weightKg / 72));
      if (p.goal === 'lose_fast') burn += 140;
      else if (p.goal === 'lose') burn += 90;

      const minCal = p.gender === 'male' ? 1450 : 1200;
      const consume = Math.max(minCal, Math.round(tdee + goalDeltas[p.goal]));
      const hM = p.heightCm / 100;
      const bmi = (p.weightKg / (hM * hM)).toFixed(1);

      let pPct = 30, cPct = 40, fPct = 30;
      if (state.preferences.dietType === 'keto') { pPct = 25; cPct = 7; fPct = 68; }
      else if (state.preferences.dietType === 'high_protein') { pPct = 35; cPct = 40; fPct = 25; }
      else if (state.preferences.dietType === 'vegan') { pPct = 25; cPct = 48; fPct = 27; }

      const waterLiters = (p.weightKg * 0.035 + burn / 1000 + (state.preferences.selectedSupplements.includes('creatine') ? 0.4 : 0)).toFixed(1);

      return {
        bmr, tdee, consume, burn, bmi, waterLiters,
        protein: Math.round((consume * (pPct / 100)) / 4),
        carbs: Math.round((consume * (cPct / 100)) / 4),
        fat: Math.round((consume * (fPct / 100)) / 9),
        pPct, cPct, fPct
      };
    }

    // Mezcla recetas clásicas con recetas nuevas según la semana elegida
    function getMealForWeekAndDay(dayIdx, mealType) {
      const baseMeal = SEVEN_DAYS_MENUS[dayIdx].meals[mealType] || SEVEN_DAYS_MENUS[dayIdx].meals['Desayuno'];
      if (state.currentWeekNumber === 1) {
        return { ...baseMeal, isNewThisWeek: false };
      }
      // En semanas 2, 3, 4 rotamos ~50% de platos con recetas nuevas y mantenemos clásicos favoritos
      const pool = EXTRA_WEEKLY_RECIPES[mealType];
      if (pool && (dayIdx + state.currentWeekNumber) % 2 === 0) {
        const picked = pool[(dayIdx + state.currentWeekNumber) % pool.length];
        return { ...picked, isNewThisWeek: true };
      }
      return { ...baseMeal, isNewThisWeek: false };
    }

    // Categoriza un ingrediente según pasillo del supermercado
    function categorizeShoppingIngredient(rawName) {
      const s = rawName.toLowerCase();
      if (/pollo|pavo|ternera|merluza|salm[oó]n|at[uú]n|lubina|dorada|gambones|bacalao|huevo|claras|lomo|solomillo|jam[oó]n/.test(s)) {
        return '🥩 Carnes, Pescados y Huevos';
      }
      if (/skyr|yogur|queso|cottage|mozzarella|feta|leche|bebida|k[eé]fir/.test(s)) {
        return '🥛 Lácteos Fit, Quesos y Bebidas';
      }
      if (/avena|arroz|quinoa|pan|bagel|tortitas|pasta|garbanzos|lentejas|boniato|patata|gnocchi|fajita|cusc[uú]s/.test(s)) {
        return '🌾 Hidratos, Panes, Cereales y Tubérculos';
      }
      if (/aguacate|pl[aá]tano|frutos rojos|ar[aá]ndanos|fresas|kiwi|manzana|esp[aá]rragos|espinacas|calabac[ií]n|br[oó]coli|tomate|pimiento|setas|calabaza|alcachofa|lim[oó]n|pepino|cebolla|can[oó]nigos|r[uú]cula|verduras|champi/.test(s)) {
        return '🥑 Frutas, Verduras y Hortalizas Frescas';
      }
      return '🫒 Despensa, Frutos Secos y Suplementos';
    }

    // Parsea cantidad, unidad y nombre base de cada ingrediente para sumar el total semanal
    function parseIngredientLine(line) {
      const clean = line.trim();
      const fracMatch = clean.match(/^(\d+)\/(\d+)\s+(.+)$/);
      if (fracMatch) {
        const val = parseFloat(fracMatch[1]) / parseFloat(fracMatch[2]);
        const rest = fracMatch[3].trim();
        return { qty: val, unit: 'ud', name: rest };
      }
      const numMatch = clean.match(/^(\d+(?:[.,]\d+)?)\s*(g|ml|kg|l|cdas?|cditas?|cazos?|rebanadas?|tortitas?|latas?)?\s+(?:de\s+)?(.+)$/i);
      if (numMatch) {
        const val = parseFloat(numMatch[1].replace(',', '.'));
        let unit = (numMatch[2] || 'ud').toLowerCase();
        if (unit === 'cda' || unit === 'cdas') unit = 'cda';
        if (unit === 'cdita' || unit === 'cditas') unit = 'cdita';
        if (unit === 'cazo' || unit === 'cazos') unit = 'cazos';
        if (unit === 'rebanada' || unit === 'rebanadas') unit = 'rebanadas';
        if (unit === 'tortita' || unit === 'tortitas') unit = 'tortitas';
        if (unit === 'lata' || unit === 'latas') unit = 'latas';
        return { qty: val, unit, name: numMatch[3].trim() };
      }
      return { qty: 1, unit: 'toma', name: clean };
    }

    // Normaliza la clave del ingrediente para agrupar iguales durante los 7 días de la semana
    function normalizeIngredientKey(name, unit) {
      let s = name.toLowerCase()
        .replace(/de corral|camperos|campero|hass|frescos|frescas|fresco|fresca|natural 0%|natural 95%|natural|real|en dados|laminado|baby|al vapor|cocida|cocido/g, '')
        .replace(/\s+/g, ' ')
        .trim();
      return `${s}__${unit}`;
    }

    // Calcula la Lista de la Compra Semanal Total (Lunes a Domingo) para las recetas de la semana activa
    function computeWeeklyShoppingList() {
      const mealTypes = state.preferences.mealsPerDay === 3
        ? ['Desayuno', 'Almuerzo', 'Cena']
        : state.preferences.mealsPerDay === 5
        ? ['Desayuno', 'Media Mañana', 'Almuerzo', 'Merienda Post-Gym', 'Cena']
        : ['Desayuno', 'Almuerzo', 'Merienda Post-Gym', 'Cena'];

      const map = {};

      SEVEN_DAYS_MENUS.forEach((dayObj, dayIdx) => {
        mealTypes.forEach(mType => {
          const recipe = getMealForWeekAndDay(dayIdx, mType);
          (recipe.ingredients || []).forEach(ingLine => {
            const parsed = parseIngredientLine(ingLine);
            const normKey = normalizeIngredientKey(parsed.name, parsed.unit);
            const itemKey = `w${state.currentWeekNumber}-${normKey}`;
            if (!map[itemKey]) {
              map[itemKey] = {
                key: itemKey,
                displayName: parsed.name.charAt(0).toUpperCase() + parsed.name.slice(1),
                unit: parsed.unit,
                totalQty: 0,
                occurrences: 0,
                daysUsed: new Set(),
                category: categorizeShoppingIngredient(parsed.name),
                isCustom: false
              };
            }
            map[itemKey].totalQty += parsed.qty;
            map[itemKey].occurrences += 1;
            map[itemKey].daysUsed.add(dayObj.day.slice(0, 3));
          });
        });
      });

      const items = Object.values(map).map(it => {
        let qtyLabel = '';
        const rounded = Math.round(it.totalQty * 10) / 10;
        if (it.unit === 'g') {
          qtyLabel = rounded >= 1000 ? `${(rounded / 1000).toFixed(2)} kg (${rounded}g)` : `${rounded} g`;
        } else if (it.unit === 'ml') {
          qtyLabel = rounded >= 1000 ? `${(rounded / 1000).toFixed(2)} L (${rounded}ml)` : `${rounded} ml`;
        } else if (it.unit === 'ud') {
          qtyLabel = `${Math.ceil(rounded)} ud.`;
        } else if (it.unit === 'toma') {
          qtyLabel = `Para ${it.occurrences} ${it.occurrences === 1 ? 'comida' : 'comidas'}`;
        } else {
          qtyLabel = `${rounded} ${it.unit}`;
        }
        return {
          ...it,
          qtyLabel,
          daysText: Array.from(it.daysUsed).join(', ')
        };
      });

      // Añadir productos personalizados agregados por el usuario
      (state.customShoppingItems || []).forEach(customIt => {
        items.push({
          key: customIt.id,
          displayName: customIt.name,
          qtyLabel: customIt.qty || 'Extra semanal',
          daysText: 'Añadido por ti',
          category: customIt.category || '🫒 Despensa, Frutos Secos y Suplementos',
          isCustom: true
        });
      });

      const categoriesOrder = [
        '🥩 Carnes, Pescados y Huevos',
        '🌾 Hidratos, Panes, Cereales y Tubérculos',
        '🥑 Frutas, Verduras y Hortalizas Frescas',
        '🥛 Lácteos Fit, Quesos y Bebidas',
        '🫒 Despensa, Frutos Secos y Suplementos'
      ];

      const grouped = categoriesOrder.map(cat => ({
        category: cat,
        items: items.filter(i => i.category === cat)
      })).filter(g => g.items.length > 0);

      const totalCount = items.length;
      const boughtCount = items.filter(i => !!state.checkedShoppingItems[i.key]).length;

      return {
        grouped,
        totalCount,
        boughtCount,
        pctBought: totalCount > 0 ? Math.round((boughtCount / totalCount) * 100) : 0
      };
    }

      if (!dateKey) return;
      const meta = getDateMetadata(dateKey);

      state.selectedDay = meta.weekdayIndex;
      state.calendarYear = meta.year;
      state.calendarMonth = meta.monthIndex;

    function changeCalendarMonth(delta) {
      const nextDate = new Date(state.calendarYear, state.calendarMonth + delta, 1);
      state.calendarYear = nextDate.getFullYear();
      state.calendarMonth = nextDate.getMonth();
      const curSel = parseDateKey(state.selectedDateKey);
      const maxDay = new Date(state.calendarYear, state.calendarMonth + 1, 0).getDate();
      const targetDay = Math.min(curSel.getDate(), maxDay);
      const updatedSel = new Date(state.calendarYear, state.calendarMonth, targetDay);
      state.selectedDateKey = formatDateKey(updatedSel);
      state.selectedDay = (updatedSel.getDay() + 6) % 7;
      render();
    }

      const today = getDeviceToday();
      state.calendarYear = today.getFullYear();
      state.calendarMonth = today.getMonth();
      state.selectedDateKey = formatDateKey(today);
      state.selectedDay = (today.getDay() + 6) % 7;
      render();

      rec.waterGlasses = Math.max(0, (rec.waterGlasses || 0) + delta);

      const dayRec = getDayRecordByDateKey(dateKey);
      if (state.loggedMealsMap[rKey]) {
        delete state.loggedMealsMap[rKey];
        dayRec.foods = dayRec.foods.filter(item => item.rKey !== rKey);
      } else {
        state.loggedMealsMap[rKey] = true;
        dayRec.foods.unshift({ rKey, title, cals, p, c, f });
      }
      render();
    }

    function logWorkoutInPlace(title, cals) {
      const now = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
      const dateKey = getDateKeyForActiveWeekday(state.selectedDay);
      state.selectedDateKey = dateKey;
      const dayRec = getDayRecordByDateKey(dateKey);
      dayRec.exercises.unshift({ title, cals, time: now });
      render();
    }

    function removeWorkoutFromDay(dateKey, exIdx) {
      const rec = getDayRecordByDateKey(dateKey);
      if (!rec) return;
      rec.exercises.splice(exIdx, 1);
      render();
    }

    function addCustomWorkoutFromInput() {
      const nameEl = document.getElementById('custom-ex-name');
      const kcalEl = document.getElementById('custom-ex-kcal');
      if (!nameEl || !kcalEl) return;
      const title = nameEl.value.trim();
      const cals = parseInt(kcalEl.value, 10);
      if (!title || isNaN(cals) || cals <= 0) return;
      logWorkoutInPlace(title, cals);
    }

    initSavedSessionOnBoot();
    render();
  </script>
</body>
</html>
